    <div id="now-playing" class="text-gray-400 flex items-center gap-3 mt-4"></div>

<script>
  const WORKER_URL = ".fm.neight.fyi";

  async function updateNowPlaying() {
    const el = document.getElementById("now-playing");
    try {
      const t = await (await fetch(WORKER_URL)).json();
      el.replaceChildren();

      if (!t.nowPlaying) {
        el.textContent = "im not playing anything rn";
        return;
      }

      if (t.image) {
        const img = document.createElement("img");
        img.src = t.image;
        img.alt = "";
        img.className = "w-12 h-12 rounded";
        el.append(img);
      }

      const a = document.createElement("a");
      a.href = t.url;
      a.className = "underline";
      a.textContent = t.name + " - " + t.artist;

      const label = document.createElement("span");
      label.textContent = "listening 2 : ";
      el.append(label, a);
    } catch (e) {
      el.textContent = "";
    }
  }

  updateNowPlaying();
  setInterval(updateNowPlaying, 20000);
</script>

    
  </body>
